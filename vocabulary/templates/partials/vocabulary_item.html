<li id="vocabulary-item-{{ item.pk }}" class="vocabulary-item">
  <article class="vocabulary-item__content">
    <header class="vocabulary-item__header">
      <h4 class="vocabulary-item__term">{{ item.word_or_phrase }}</h4>
      <span class="level-badge level-badge--{{ item.cefr_level|lower }}">{{ item.cefr_level }}</span>
      <span class="type-badge">{{ item.get_type_display }}</span>
      <form
        class="vocabulary-item__delete"
        method="post"
        action="{% url 'vocabulary:item_delete' item.pk %}"
        hx-post="{% url 'vocabulary:item_delete' item.pk %}"
        hx-target="#vocabulary-item-{{ item.pk }}"
        hx-swap="outerHTML"
        hx-confirm="Delete this vocabulary entry?"
        hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
        data-remove-on-success
      >
        {% csrf_token %}
        <button class="icon-button icon-button--quiet" type="submit" aria-label="Delete {{ item.word_or_phrase }}" title="Delete">
          <i data-lucide="trash-2" aria-hidden="true"></i>
        </button>
      </form>
    </header>
    <p class="vocabulary-item__definition">{{ item.definition_en }}</p>
    <blockquote class="vocabulary-item__example">{{ item.example_sentence }}</blockquote>
  </article>
</li>
