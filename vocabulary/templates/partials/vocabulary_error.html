<div class="form-alert vocabulary-error" role="alert">
  <i data-lucide="circle-alert" aria-hidden="true"></i>
  <div>
  <p>{{ message }}</p>
  {% if form.errors %}
    <ul>
      {% for field in form %}
        {% for error in field.errors %}
          <li>{{ field.label }}: {{ error }}</li>
        {% endfor %}
      {% endfor %}
      {% for error in form.non_field_errors %}
        <li>{{ error }}</li>
      {% endfor %}
    </ul>
  {% endif %}
  </div>
</div>
