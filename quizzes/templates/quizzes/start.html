{% extends "base.html" %}

{% block title %}Start a quiz | Filmocabulary{% endblock %}
{% block body_class %}quiz-page{% endblock %}

{% block content %}
<header class="page-header">
  <div>
    <p class="page-kicker">Practice</p>
    <h1>Build a movie mix</h1>
  </div>
  <a class="button button--secondary" href="{% url 'quizzes:history' %}">
    <i data-lucide="history" aria-hidden="true"></i>
    <span>Quiz history</span>
  </a>
</header>

<section id="quiz-launch-region" class="quiz-workspace" aria-live="polite">
  {% include "partials/quiz_start_form.html" %}
</section>
{% endblock %}
