<section class="quiz-complete" aria-labelledby="quiz-complete-title">
  <div class="quiz-complete__icon">
    <i data-lucide="trophy" aria-hidden="true"></i>
  </div>
  <p class="page-kicker">Quiz complete</p>
  <h2 id="quiz-complete-title">{{ session.correct_answers }} of {{ session.total_questions }}</h2>
  <p class="quiz-complete__score">{{ session.score_percentage }}%</p>
  <div class="quiz-complete__movies">
    {% for movie in session.selected_movies.all %}
      <span>{{ movie.title }}{% if movie.release_year %} ({{ movie.release_year }}){% endif %}</span>
    {% endfor %}
  </div>
  <div class="quiz-complete__actions">
    <a class="button button--primary" href="{% url 'quizzes:start' %}">
      <i data-lucide="rotate-cw" aria-hidden="true"></i>
      <span>New quiz</span>
    </a>
    <a class="button button--secondary" href="{% url 'quizzes:history' %}">
      <i data-lucide="history" aria-hidden="true"></i>
      <span>View history</span>
    </a>
  </div>
</section>
